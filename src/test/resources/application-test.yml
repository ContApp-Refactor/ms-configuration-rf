spring:
  datasource:
    url: jdbc:h2:mem:factures;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test
          jwk-set-uri: http://localhost/test/certs
  # EmailService inyecta JavaMailSender: sin spring.mail.host el bean no se crea
  # y el contexto de los tests que lo cargan falla. Host de mentira, no se envía.
  mail:
    host: localhost
    port: 1025
eureka:
  client:
    enabled: false
jwt:
  auth:
    converter:
      principle-attribute: preferred_username
      resource-id: microservices_client
baseUrl: http://localhost

# ── Módulo auxiliary-book (migrado) ─────────────────────────────────────
services:
  account-info-service:
    base-url: http://localhost/accountInfo/accountInfo
  third-service:
    base-url: lb://THIRDS
    mock-enabled: ${THIRD_SERVICE_MOCK_ENABLED:true}

notification-settings:
  mail:
    from: test@test.local
    default-subject: Reporte programado

scheduled:
  reports:
    poller:
      delay-ms: 60000
      batch-size: 50
