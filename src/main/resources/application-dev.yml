spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/general_config}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      connection-timeout: 20000  # 20 segundos para obtener conexión del pool
      idle-timeout: 300000       # 5 minutos antes de cerrar conexiones idle
      max-lifetime: 1200000      # 20 minutos máximo lifetime de conexión
      maximum-pool-size: 20      # Máximo 20 conexiones
      minimum-idle: 5            # Mínimo 5 conexiones idle
      validation-timeout: 5000   # 5 segundos para validar conexión
      leak-detection-threshold: 60000  # 60 segundos para detectar leaks
  jpa:
    hibernate:
      ddl-auto: ${DB_HIBERNATE_DDL_AUTO:create-drop}
    properties:
      hibernate:
        jdbc:
          batch-size: 1000
        order-inserts: true
        order-updates: true
        batch-versioned-data: true
        timeout: 30  # Timeout en segundos para consultas
    open-in-view: false  # Importante para evitar problemas con EntityManager

  transaction:
    default-timeout: 30  # Timeout por defecto para transacciones en segundos

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB
      enabled: true
      file-size-threshold: 2KB
      resolve-lazily: false

  h2:
    console:
      enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:30000}
    requested-heartbeat: ${RABBITMQ_HEARTBEAT:30}
    # Connection pool
    cache:
      connection:
        mode: connection
        size: ${RABBITMQ_CONNECTION_POOL_SIZE:5}
      channel:
        size: ${RABBITMQ_CHANNEL_POOL_SIZE:25}
        checkout-timeout: ${RABBITMQ_CHANNEL_CHECKOUT_TIMEOUT:5000}
    # Listener container
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_PREFETCH:10}
        concurrency: ${RABBITMQ_CONCURRENCY:1}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:5}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/auth/realms/oauth2-realm}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/auth/realms/oauth2-realm/protocol/openid-connect/certs}
          
server:
  port: ${PORT:0}
  tomcat:
    connection-timeout: 60000
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10
    max-http-form-post-size: 8MB
eureka:
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"
    hostname: ${INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  level:
    org:
      Keycloak: ${KEYCLOAK_LOG_LEVEL:DEBUG}
jwt:
  auth:
    converter:
      principle-attribute: ${JWT_PRINCIPAL_ATTR:preferred_username}
      resource-id: ${JWT_RESOURCE_ID:microservices_client}

management:
  endpoint:
    health:
      probes:
        enabled: true

file-upload:
  max-size: 5242880
  allowed-extensions:
    excel:
      - ".xlsx"
      - ".xls"
    pdf:
      - ".pdf"
  allowed-mime-types:
    excel:
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      - "application/vnd.ms-excel"
    pdf:
      - "application/pdf"
