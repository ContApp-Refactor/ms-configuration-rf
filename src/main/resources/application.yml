spring:
  application:
    name: CONFIG

  profiles:
    active:
    - ${PROFILE:dev}
  jpa:
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 3600
    fallback-to-system-locale: false
    use-code-as-default-message: false
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

springdoc:
  swagger-ui:
    path: ${SWAGGER_PATH:/swagger-ui.html}

server:
  error:
    include-stacktrace: never
